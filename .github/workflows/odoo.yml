name: Deploy Odoo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Stop Odoo
        run: |
          sudo systemctl stop odoo

      - name: Deploy Odoo source
        run: |
          sudo rsync -a \
            --exclude='.git' \
            --exclude='venv' \
            --exclude='__pycache__' \
            ./ /opt/odoo/

      - name: Set permissions
        run: |
          sudo chown -R walletadmin:walletadmin /opt/odoo

      - name: Install Python dependencies
        run: |
          cd /opt/odoo
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Start Odoo
        run: |
          sudo systemctl start odoo

      - name: Check Odoo service
        run: |
          sudo systemctl is-active --quiet odoo

      - name: Show Odoo status
        if: always()
        run: |
          sudo systemctl status odoo --no-pager
          sudo journalctl -u odoo -n 50 --no-pager

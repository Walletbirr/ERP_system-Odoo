name: Odoo 18 Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug runner
        run: |
          echo "=== Runner Information ==="
          whoami
          id
          groups
          echo "=== Searching for exact Odoo service name ==="
          systemctl list-units --type=service | grep -i odoo  echo "No odoo services found!"
          echo "=== Odoo service status before deployment ==="
          sudo systemctl status odoo --no-pager  echo "Odoo service not active or not found"

      - name: Stop Odoo
        run: |
          # The ' true' ensures the pipeline doesn't fail if Odoo is already stopped
          sudo systemctl stop odoo  true

      - name: Sync project
        run: |
          # CRITICAL: The --exclude flags prevent rsync from deleting your venv and .git folders!
          rsync -av --delete --exclude='venv/' --exclude='.git/' ./ /data/ERP_system-Odoo/

      - name: Install dependencies
        run: |
          source /data/ERP_system-Odoo/venv/bin/activate
          pip install -r /data/ERP_system-Odoo/requirements.txt

      - name: Upgrade modules
        run: |
          /data/ERP_system-Odoo/venv/bin/python /opt/odoo/odoo-bin \
            -c /etc/odoo.conf \
            -d erpodoo \
            -u all \
            --stop-after-init

      - name: Start Odoo
        run: sudo systemctl start odoo

      - name: Verify Odoo
        run: |
          echo "=== Waiting for Odoo to start ==="
          sleep 8
          sudo systemctl status odoo --no-pager